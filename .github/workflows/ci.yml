name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

defaults:
  run:
    working-directory: proto-blue

jobs:
  build-and-test:
    name: Build & test (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: proto-blue
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rustfmt
        run: cargo fmt --all -- --check

  wasm32:
    name: Check wasm32 (pure subset)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: proto-blue
          key: wasm32
      # The default-features=false check on the top-level crate exercises
      # every pure subcrate at once (syntax, crypto, lex_data, lex_cbor,
      # lex_json, common, lexicon, repo). If a future dependency drags a
      # native-only crate into one of these, this check fails.
      - name: Check proto-blue (default-features=false)
        run: cargo check --target wasm32-unknown-unknown -p proto-blue --no-default-features
      # Also exercise each pure crate on its own so a per-crate regression
      # surfaces distinctly instead of hiding inside the aggregate check.
      - name: Check pure subcrates
        run: |
          for crate in \
            proto-blue-syntax \
            proto-blue-crypto \
            proto-blue-lex-data \
            proto-blue-lex-cbor \
            proto-blue-lex-json \
            proto-blue-common \
            proto-blue-lexicon \
            proto-blue-repo; do
            echo "::group::$crate"
            cargo check --target wasm32-unknown-unknown -p "$crate" --no-default-features
            echo "::endgroup::"
          done
      # The xrpc crate exposes a browser `fetch()` backend via the
      # `fetch-web` feature (gloo-net).
      - name: Check proto-blue-xrpc (fetch-web)
        run: cargo check --target wasm32-unknown-unknown -p proto-blue-xrpc --no-default-features --features fetch-web
      # The top-level proto-blue with the full feature set compiles for
      # wasm32: target-conditional deps pick gloo-net/gloo-ws automatically.
      - name: Check proto-blue (default features, wasm32)
        run: cargo check --target wasm32-unknown-unknown -p proto-blue
      # Identity resolution — DNS is native-only, so wasm uses the HTTPS
      # .well-known fallback via the same fetch-web backend.
      - name: Check proto-blue-identity (fetch-web, no DNS)
        run: cargo check --target wasm32-unknown-unknown -p proto-blue-identity --no-default-features --features fetch-web
      # WebSocket client — gloo-ws backs the browser's native WebSocket.
      - name: Check proto-blue-ws (gloo-ws)
        run: cargo check --target wasm32-unknown-unknown -p proto-blue-ws --no-default-features --features gloo-ws
      # High-level API + OAuth, both routed through the xrpc/fetch-web transport.
      - name: Check proto-blue-api (fetch-web)
        run: cargo check --target wasm32-unknown-unknown -p proto-blue-api --no-default-features --features fetch-web
      - name: Check proto-blue-oauth (fetch-web)
        run: cargo check --target wasm32-unknown-unknown -p proto-blue-oauth --no-default-features --features fetch-web

  docs:
    name: Build docs (all-features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: proto-blue
          key: docs
      - name: cargo doc
        run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
