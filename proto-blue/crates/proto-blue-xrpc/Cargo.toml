[package]
name = "proto-blue-xrpc"
description = "AT Protocol XRPC HTTP client and server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["atproto", "bluesky", "xrpc", "http-client", "rpc"]
categories = ["web-programming::http-client", "api-bindings"]

[dependencies]
proto-blue-lexicon = { workspace = true }
proto-blue-lex-json = { workspace = true }
proto-blue-common = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }

# Server-side reqwest access (the `with_client` constructor takes a
# `reqwest::Client` directly). Optional, gated behind `fetch-reqwest`.
reqwest = { workspace = true, optional = true }

# Native runtime — the server and some tests need more tokio features
# than the minimal set. Layered per-feature below.
tokio = { workspace = true, features = ["macros", "rt", "sync"] }

# Optional native server.
axum = { workspace = true, optional = true }

[features]
# Default: full native stack (server + reqwest client), matching pre-refactor behaviour.
default = ["server", "fetch-reqwest"]

# Axum-based inbound XRPC server. Native-only.
server = ["dep:axum", "tokio/net", "tokio/io-util", "tokio/rt-multi-thread", "tokio/time"]

# Enable the reqwest-backed `FetchHandler` (`ReqwestFetcher`) from
# `proto-blue-common`. Also exposes `XrpcClient::with_client` for callers
# who want to pass their own `reqwest::Client`.
fetch-reqwest = ["dep:reqwest", "proto-blue-common/fetch-reqwest"]

# Enable the `gloo-net`-backed `FetchHandler` for wasm32.
fetch-web = ["proto-blue-common/fetch-web"]

[dev-dependencies]
proptest = { workspace = true }
tower = { version = "0.5", features = ["util"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }
async-trait = { workspace = true }
