[package]
name = "proto-blue-xrpc"
description = "AT Protocol XRPC HTTP client and server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["atproto", "bluesky", "xrpc", "http-client", "rpc"]
categories = ["web-programming::http-client", "api-bindings"]

[dependencies]
proto-blue-lexicon = { workspace = true }
proto-blue-lex-json = { workspace = true }
proto-blue-lex-data = { workspace = true }
proto-blue-lex-cbor = { workspace = true }
proto-blue-common = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }

# Native runtime — the server and some tests need more tokio features
# than the minimal set. Layered per-feature below.
tokio = { workspace = true, features = ["macros", "rt", "sync"] }

# `reqwest` and `axum` are native-only: both pull in tokio with
# features (`net`, `rt-multi-thread`) that fail to compile on wasm.
# Gating them behind `cfg(not(target_arch = "wasm32"))` means the
# `fetch-reqwest` / `server` features can stay on by default without
# breaking wasm consumers — cargo simply drops these deps on wasm.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true, optional = true }
axum = { workspace = true, optional = true }

[features]
# Default: reqwest HTTP client only. The axum-based inbound `server`
# is NOT in `default` because it pulls in `tokio/net` +
# `tokio/rt-multi-thread`, which fail to compile on wasm32. Direct
# callers who want the server opt in via `features = ["server"]`; the
# umbrella `proto-blue` crate opts in on native via its own
# target-conditional dep spec.
default = ["fetch-reqwest"]

# Axum-based inbound XRPC server (including subscription / WebSocket
# streams). Native-only — enabling on wasm fails to compile because
# the required tokio features (`net`, `rt-multi-thread`) are not
# supported on wasm.
server = ["dep:axum", "axum/ws", "tokio/net", "tokio/io-util", "tokio/rt-multi-thread", "tokio/time"]

# Enable the reqwest-backed `FetchHandler` (`ReqwestFetcher`) from
# `proto-blue-common`. Also exposes `XrpcClient::with_client` for callers
# who want to pass their own `reqwest::Client`.
fetch-reqwest = ["dep:reqwest", "proto-blue-common/fetch-reqwest"]

# Enable the `gloo-net`-backed `FetchHandler` for wasm32.
fetch-web = ["proto-blue-common/fetch-web"]

[dev-dependencies]
proptest = { workspace = true }
tower = { version = "0.5", features = ["util"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }
async-trait = { workspace = true }
tokio-tungstenite = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
proto-blue-lex-cbor = { workspace = true }
proto-blue-lex-data = { workspace = true }

[lints]
workspace = true
