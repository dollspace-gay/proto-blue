[package]
name = "proto-blue-xrpc"
description = "AT Protocol XRPC HTTP client and server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["atproto", "bluesky", "xrpc", "http-client", "rpc"]
categories = ["web-programming::http-client", "api-bindings"]

[dependencies]
proto-blue-lexicon = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
axum = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
proto-blue-common = { workspace = true }
tower = { version = "0.5", features = ["util"] }
