[package]
name = "proto-blue-identity"
description = "AT Protocol identity resolution: DID and handle resolution"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["atproto", "bluesky", "did", "identity", "resolution"]
categories = ["authentication", "web-programming"]

[dependencies]
proto-blue-common = { workspace = true }
proto-blue-crypto = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "time"] }

# DNS-based handle resolution. Native-only (hickory-resolver uses OS
# sockets). Off on wasm32 by default; the HTTPS `.well-known` path still
# works everywhere.
hickory-resolver = { workspace = true, optional = true }

# Used by the DID-cache background-refresh path on wasm32. Optional;
# only pulled in when `fetch-web` is active.
wasm-bindgen-futures = { version = "0.4", optional = true }

[dev-dependencies]
async-trait = { workspace = true }

[features]
# Native default: DNS + reqwest fetch. Matches the pre-refactor behaviour.
default = ["dns", "fetch-reqwest"]

# DNS TXT-record handle resolution via hickory-resolver. Native-only;
# leave off for wasm builds.
dns = ["dep:hickory-resolver"]

# Native HTTP transport (`reqwest`) for DID / HTTPS handle resolution.
fetch-reqwest = ["proto-blue-common/fetch-reqwest"]

# Browser HTTP transport (`fetch()` via gloo-net) for wasm32. Also
# enables background cache-refresh via wasm-bindgen-futures.
fetch-web = ["proto-blue-common/fetch-web", "dep:wasm-bindgen-futures"]
