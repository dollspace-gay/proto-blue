[package]
name = "proto-blue-oauth"
description = "AT Protocol OAuth 2.0 client: DPoP, PKCE, PAR, session management"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["atproto", "bluesky", "oauth", "dpop", "pkce"]
categories = ["authentication", "web-programming"]

[dependencies]
proto-blue-common = { workspace = true }
proto-blue-crypto = { workspace = true }
proto-blue-xrpc = { workspace = true }

# Optional: full identity resolution (handle → DID → PDS → resource
# metadata → AS) inside `authorize_from_input`. Enabled by the
# `identity-resolver` feature. Defaults to off so minimal / server-only
# OAuth clients don't pull in DNS + PLC crates.
proto-blue-identity = { workspace = true, optional = true, default-features = false }
base64 = { workspace = true }
url = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
rand = { workspace = true }
chrono = { workspace = true }
p256 = { workspace = true }
k256 = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
async-trait = { workspace = true }

# Back-compat constructors that accept a `reqwest::Client` directly.
# Only required when the `fetch-reqwest` feature is on.
reqwest = { workspace = true, optional = true }

[features]
# Native default: reqwest HTTP transport, with DNS handle resolution
# available through proto-blue-identity's default features.
default = ["fetch-reqwest"]

# Native `reqwest`-backed HTTP. Enables `OAuthClient::new`,
# `::with_http_client`, and `OAuthSession::new` / `::with_http_client`.
fetch-reqwest = [
    "dep:reqwest",
    "proto-blue-common/fetch-reqwest",
    "proto-blue-xrpc/fetch-reqwest",
    "proto-blue-identity?/fetch-reqwest",
]

# Browser `fetch()`-backed HTTP for wasm32.
fetch-web = [
    "proto-blue-common/fetch-web",
    "proto-blue-xrpc/fetch-web",
    "proto-blue-identity?/fetch-web",
]

# Full identity resolution (handle / DID / PDS URL → PDS → AS) inside
# `OAuthClient::resolve_from_input`. Pulls in `proto-blue-identity`.
identity-resolver = ["dep:proto-blue-identity"]

[dev-dependencies]
proptest = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }
