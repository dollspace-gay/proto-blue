[package]
name = "proto-blue-ws"
description = "AT Protocol WebSocket client with auto-reconnection"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["atproto", "bluesky", "websocket", "streaming", "reconnection"]
categories = ["web-programming", "network-programming"]

[dependencies]
proto-blue-common = { workspace = true }
proto-blue-lex-data = { workspace = true }
proto-blue-lex-cbor = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
rand = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "time"] }

# Browser WS backend.
gloo-net = { version = "0.6", features = ["websocket"], optional = true }

# Native WS backend — `tokio-tungstenite` pulls in `tokio/net`,
# `tokio/rt-multi-thread`, and `native-tls`, none of which compile on
# wasm. Target-gating means enabling `tungstenite` on wasm is a no-op
# instead of a build break.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio-tungstenite = { workspace = true, optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring"], optional = true }

[features]
# Default: native tungstenite backend. Matches pre-refactor behaviour.
default = ["tungstenite"]

# `tokio-tungstenite`-backed connector. Native only; pulls in TCP socket
# support and `native-tls`. The `tokio/net` activation here is native-
# only because the whole dep is native-only; we still list it so
# enabling `tungstenite` on native produces the full feature set.
tungstenite = ["dep:tokio-tungstenite"]

# Rustls-based TLS for the tungstenite connector. When enabled,
# `TungsteniteConnector::with_rustls_config` is available and lets
# operators pass a custom `rustls::ClientConfig` (for adding internal
# CA roots in self-hosted deployments, pinning, etc.). Webpki roots
# are bundled so the default chain still validates public certs.
rustls-tls = [
    "dep:rustls",
    "tungstenite",
    "tokio-tungstenite?/rustls-tls-webpki-roots",
]

# `gloo-net`-backed WebSocket connector for `wasm32-unknown-unknown`.
# Uses the browser's native `WebSocket` via `wasm-bindgen`.
gloo-ws = ["dep:gloo-net"]

[dev-dependencies]
proptest = { workspace = true }
# The keep-alive state-machine test needs a runtime with `rt`
# enabled to drive the async loop from inside a proptest body.
tokio = { workspace = true, features = ["macros", "rt", "time", "sync"] }
