[package]
name = "proto-blue-interop-tests"
version = "0.0.0"
edition = "2024"
publish = false
description = "Differential tests against @atproto/* TypeScript SDK"

[dependencies]
proto-blue-syntax = { path = "../proto-blue-syntax" }
proto-blue-common = { path = "../proto-blue-common" }
proto-blue-crypto = { path = "../proto-blue-crypto" }
proto-blue-lex-data = { path = "../proto-blue-lex-data" }
proto-blue-lex-cbor = { path = "../proto-blue-lex-cbor" }
proto-blue-lex-json = { path = "../proto-blue-lex-json" }
proto-blue-lexicon = { path = "../proto-blue-lexicon" }

[dev-dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
hex = "0.4"
# Pretty diffs on assertion failures — much easier to read the first
# real interop divergence with colored side-by-side output than a
# blob `{...}` dump from the default assert_eq!.
pretty_assertions = "1.4"
