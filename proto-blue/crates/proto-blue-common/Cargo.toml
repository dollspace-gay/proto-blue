[package]
name = "proto-blue-common"
description = "AT Protocol shared utilities: TID generation, DID documents, retry, IPLD helpers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["atproto", "bluesky", "did-document", "tid", "utilities"]
categories = ["web-programming", "data-structures"]

[dependencies]
proto-blue-syntax = { workspace = true }
proto-blue-lex-data = { workspace = true }
proto-blue-lex-json = { workspace = true }
proto-blue-lex-cbor = { workspace = true }
http = "1"
unicode-segmentation = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "time", "sync"] }
tokio-util = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }

# Optional backends for the `FetchHandler` trait. `reqwest` is
# native-only: it pulls in hyper + tokio features (`rt-multi-thread`,
# `net`) that don't compile on wasm. Gating it behind
# `cfg(not(target_arch = "wasm32"))` lets the `fetch-reqwest` feature
# stay quietly enabled on wasm builds (no effect) instead of breaking
# them.

# Native: reqwest as an optional dep, gated by `fetch-reqwest`.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true, optional = true }

# (Wasm deps consolidated into the single target-conditional table
# below, alongside the `getrandom` entry — cargo forbids duplicate
# `[target.'cfg(…)'.dependencies]` sections.)

[features]
# No features on by default — pure subset only. Consumers opt into a
# concrete `FetchHandler` implementation via `fetch-reqwest` (native) or
# `fetch-web` (wasm). Crates that need HTTP by default should toggle these
# on themselves.
default = []

# `ReqwestFetcher` — native `reqwest`-backed fetch handler. The tokio
# feature activations are deliberately NOT listed here because
# `tokio/rt-multi-thread` doesn't exist on wasm; reqwest/hyper pull in
# the tokio features they need on their own when they're actually
# built (i.e. on native targets).
fetch-reqwest = ["dep:reqwest"]

# Kept for source-compatibility with downstream Cargo.toml files that
# explicitly set `features = ["fetch-web"]`. The `WebFetcher` impl is
# now always compiled on wasm (its deps — gloo-net / js-sys — are
# target-conditional unconditional deps, above), so this feature is a
# no-op.
fetch-web = []

[dev-dependencies]
proptest = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }

# Wasm-only dependencies:
# - `gloo-net` + `js-sys` back `WebFetcher`; always compiled on wasm so
#   consumer crates get a default fetcher without the `fetch-web` flag.
# - `getrandom` with the `js` feature routes `rand`'s OS entropy
#   source through `crypto.getRandomValues()`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-net = { version = "0.6", features = ["http"] }
js-sys = "0.3"
getrandom = { version = "0.2", features = ["js"] }

[lints]
workspace = true
