[package]
name = "proto-blue"
description = "AT Protocol SDK for Rust — full-stack client for Bluesky and the AT Protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["atproto", "bluesky", "sdk", "decentralized", "social"]
categories = ["api-bindings", "web-programming::http-client"]

[dependencies]
# Pure crates — always compiled, wasm-compatible.
proto-blue-syntax = { workspace = true }
proto-blue-crypto = { workspace = true }
proto-blue-lex-data = { workspace = true }
proto-blue-lex-cbor = { workspace = true }
proto-blue-lex-json = { workspace = true }
proto-blue-common = { workspace = true }
proto-blue-lexicon = { workspace = true }
proto-blue-repo = { workspace = true }

# Network-dependent crates — gated behind cargo features.
proto-blue-xrpc = { workspace = true, optional = true }
proto-blue-ws = { workspace = true, optional = true }
proto-blue-identity = { workspace = true, optional = true }
proto-blue-api = { workspace = true, optional = true }
proto-blue-oauth = { workspace = true, optional = true }

[features]
# Default to the full native SDK — existing users get the same API they
# had before. Downstreams that need wasm-compatibility should set
# `default-features = false` and opt into the pure subset.
default = ["full"]

# Everything. Matches the pre-0.2.2 surface.
full = ["net", "ws", "resolver", "oauth", "api"]

# XRPC HTTP client / server (native reqwest transport + axum server).
net = ["dep:proto-blue-xrpc", "proto-blue-xrpc/server", "proto-blue-xrpc/fetch-reqwest"]

# Live firehose WebSocket (`ws` and `repo::Firehose`).
ws = ["dep:proto-blue-ws", "proto-blue-repo/firehose-client"]

# DID / handle resolution (depends on HTTP; defaults to native reqwest + DNS).
resolver = ["dep:proto-blue-identity", "net"]

# OAuth 2.0 client (defaults to native reqwest transport).
oauth = ["dep:proto-blue-oauth", "proto-blue-oauth/fetch-reqwest"]

# High-level agent (defaults to native reqwest transport via xrpc).
api = ["dep:proto-blue-api", "proto-blue-api/fetch-reqwest", "net"]

[dev-dependencies]
serde_json = { workspace = true }
proptest = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
