[package]
name = "proto-blue"
description = "AT Protocol SDK for Rust — full-stack client for Bluesky and the AT Protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["atproto", "bluesky", "sdk", "decentralized", "social"]
categories = ["api-bindings", "web-programming::http-client"]

[dependencies]
# Pure crates — always compiled, wasm-compatible.
proto-blue-syntax = { workspace = true }
proto-blue-crypto = { workspace = true }
proto-blue-lex-data = { workspace = true }
proto-blue-lex-cbor = { workspace = true }
proto-blue-lex-json = { workspace = true }
proto-blue-common = { workspace = true }
proto-blue-lexicon = { workspace = true }
proto-blue-repo = { workspace = true }

# Network-dependent crates are listed under target-conditional sections
# below so that each target automatically picks the appropriate backend
# (reqwest / tungstenite / hickory on native, gloo-net on wasm) without
# the user having to opt into different features per target.

# ── Native backends ────────────────────────────────────────────────────
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
proto-blue-xrpc = { workspace = true, optional = true, features = ["server", "fetch-reqwest"] }
proto-blue-ws = { workspace = true, optional = true, features = ["tungstenite"] }
proto-blue-identity = { workspace = true, optional = true, features = ["dns", "fetch-reqwest"] }
proto-blue-api = { workspace = true, optional = true, features = ["fetch-reqwest"] }
proto-blue-oauth = { workspace = true, optional = true, features = ["fetch-reqwest"] }

# ── Wasm backends ──────────────────────────────────────────────────────
[target.'cfg(target_arch = "wasm32")'.dependencies]
proto-blue-xrpc = { workspace = true, optional = true, features = ["fetch-web"] }
proto-blue-ws = { workspace = true, optional = true, features = ["gloo-ws"] }
proto-blue-identity = { workspace = true, optional = true, features = ["fetch-web"] }
proto-blue-api = { workspace = true, optional = true, features = ["fetch-web"] }
proto-blue-oauth = { workspace = true, optional = true, features = ["fetch-web"] }

[features]
# Default to the full SDK — same API surface as before. On wasm32 the
# target-conditional dependency table above automatically swaps in the
# browser-native backends, so `full` builds cleanly on every target.
default = ["full"]

# Everything. Pick the right backend per target (reqwest/tungstenite/dns
# on native, gloo-net on wasm).
full = ["net", "ws", "resolver", "oauth", "api"]

# XRPC HTTP client (native also includes the axum server).
net = ["dep:proto-blue-xrpc"]

# Live firehose WebSocket (`ws` and `repo::Firehose`).
ws = ["dep:proto-blue-ws", "proto-blue-repo/firehose-client"]

# DID / handle resolution. Native includes DNS handle resolution; on
# wasm only the HTTPS `.well-known` path runs.
resolver = ["dep:proto-blue-identity", "net"]

# OAuth 2.0 client.
oauth = ["dep:proto-blue-oauth", "resolver"]

# High-level agent.
api = ["dep:proto-blue-api", "net"]

[dev-dependencies]
serde_json = { workspace = true }
proptest = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
