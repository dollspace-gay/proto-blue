[workspace]
members = [
    "crates/proto-blue-syntax",
    "crates/proto-blue-crypto",
    "crates/proto-blue-lex-data",
    "crates/proto-blue-lex-cbor",
    "crates/proto-blue-lex-json",
    "crates/proto-blue-common",
    "crates/proto-blue-lexicon",
    "crates/proto-blue-repo",
    "crates/proto-blue-xrpc",
    "crates/proto-blue-ws",
    "crates/proto-blue-identity",
    "crates/proto-blue-api",
    "crates/proto-blue-codegen",
    "crates/proto-blue-oauth",
    "crates/proto-blue",
    "crates/proto-blue-interop-tests",
    "examples",
]
# `fuzz/` has its own separate workspace so `cargo-fuzz`'s custom
# rustc flags don't poison the main workspace build.
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
version = "0.2.5"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dollspace-gay/proto-blue"
rust-version = "1.85"

[workspace.dependencies]
# Internal crates
proto-blue-syntax = { version = "0.2.5", path = "crates/proto-blue-syntax" }
proto-blue-crypto = { version = "0.2.5", path = "crates/proto-blue-crypto" }
proto-blue-lex-data = { version = "0.2.5", path = "crates/proto-blue-lex-data" }
proto-blue-lex-cbor = { version = "0.2.5", path = "crates/proto-blue-lex-cbor" }
proto-blue-lex-json = { version = "0.2.5", path = "crates/proto-blue-lex-json" }
proto-blue-common = { version = "0.2.5", path = "crates/proto-blue-common" }
proto-blue-lexicon = { version = "0.2.5", path = "crates/proto-blue-lexicon" }
proto-blue-repo = { version = "0.2.5", path = "crates/proto-blue-repo", default-features = false }
proto-blue-xrpc = { version = "0.2.5", path = "crates/proto-blue-xrpc", default-features = false }
# Network-layer subcrates: workspace deps default to features-off so the
# target-conditional tables in `crates/proto-blue/Cargo.toml` can pick the
# right backend per target. Standalone users of each subcrate still get
# sensible defaults via `cargo add` (each crate's own `default` feature).
proto-blue-ws = { version = "0.2.5", path = "crates/proto-blue-ws", default-features = false }
proto-blue-identity = { version = "0.2.5", path = "crates/proto-blue-identity", default-features = false }
proto-blue-api = { version = "0.2.5", path = "crates/proto-blue-api", default-features = false }
proto-blue-oauth = { version = "0.2.5", path = "crates/proto-blue-oauth", default-features = false }

# External dependencies
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"
once_cell = "1"
sha2 = "0.10"
p256 = { version = "0.13", features = ["ecdsa"] }
k256 = { version = "0.13", features = ["ecdsa"] }
rand = "0.8"
bs58 = "0.5"
multibase = "0.9"
unsigned-varint = "0.8"
base64 = "0.22"
ciborium = "0.2"
unicode-segmentation = "1"
tracing = "0.1"
tokio = { version = "1", default-features = false }
tokio-util = "0.7"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json"] }
hickory-resolver = "0.25"
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures = "0.3"
async-trait = "0.1"
url = "2"
quote = "1"
proc-macro2 = "1"
syn = "2"
clap = { version = "4", features = ["derive"] }
jsonwebtoken = "10"
proptest = "1"
